name: Compatibility check

on:
  schedule:
    # run once per day at 04:17 UTC (06:17 Europe/Madrid during CEST, 05:17 during CET)
    - cron: '17 4 * * *'
  workflow_dispatch: {}

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Update Jellyfin packages (try latest, ignore failures)
        run: |
          dotnet add Jellyfin.Plugin.MediaTracker/Jellyfin.Plugin.MediaTracker.csproj package Jellyfin.Controller --prerelease || true
          dotnet add Jellyfin.Plugin.MediaTracker/Jellyfin.Plugin.MediaTracker.csproj package Jellyfin.Model --prerelease || true
          dotnet add Jellyfin.Plugin.MediaTracker.Tests/Jellyfin.Plugin.MediaTracker.Tests.csproj package Jellyfin.Controller --prerelease || true
          dotnet add Jellyfin.Plugin.MediaTracker.Tests/Jellyfin.Plugin.MediaTracker.Tests.csproj package Jellyfin.Model --prerelease || true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore MediaTracker.sln

      - name: Run tests (exclude integration)
        run: dotnet test --no-build --verbosity minimal --filter "Category!=Integration"
